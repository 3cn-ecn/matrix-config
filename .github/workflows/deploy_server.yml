name: Deploy Matrix

on:
  push:
    branches:
      - main
    paths:
      - host_vars/**
      - modules/**
      - hosts
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy to the VPS
        timeout-minutes: 30
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INSTANCE_ADDRESS }}
          username: "ubuntu"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd matrix-docker-ansible-deploy
            # Update the repo
            cd inventory
            git stash
            git pull
            git stash pop
            cd ..
            # Configure the vault password and run the playbook
            echo "${{ secrets.VAULT_PASS_PROD }}" | ansible-playbook -i inventory/hosts_local setup.yml --tags=setup-all,ensure-matrix-users-created,start --vault-password-file=/bin/cat
