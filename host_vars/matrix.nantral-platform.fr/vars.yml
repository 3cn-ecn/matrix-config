    email_address: contact@nantral-platform.fr
    role: m.role.admin
  - matrix_id: "@bde:{{ matrix_domain }}"
    email_address: bdecentralenantes@gmail.com
    role: m.role.security
matrix_static_files_file_matrix_support_property_m_support_page: "https://nantral-platform.fr/feedback"

## Bridges
matrix_bridges_encryption_enabled: true
matrix_appservice_double_puppet_enabled: true
# WhatsApp
matrix_bridge_mautrix_whatsapp_enabled: false
matrix_bridge_mautrix_whatsapp_appservice_bot_username: "bridge.whatsapp"
matrix_bridge_mautrix_whatsapp_bridge_username_prefix: "bridge.whatsapp."
matrix_bridge_mautrix_whatsapp_configuration_extension_yaml: |
  appservice:
    username_template: "{{ matrix_bridge_mautrix_whatsapp_bridge_username_prefix + '{{.}}' }}"
matrix_bridge_mautrix_whatsapp_registration_yaml: |
  id: whatsapp
  url: {{ matrix_bridge_mautrix_whatsapp_appservice_address }}
  as_token: "{{ matrix_bridge_mautrix_whatsapp_appservice_token }}"
  hs_token: "{{ matrix_bridge_mautrix_whatsapp_homeserver_token }}"
  # See https://github.com/mautrix/signal/issues/43
  sender_localpart: _bot_{{ matrix_bridge_mautrix_whatsapp_appservice_bot_username }}
  rate_limited: false
  namespaces:
      users:
      - regex: '^@{{ matrix_bridge_mautrix_whatsapp_bridge_username_prefix | regex_escape }}.*:{{ matrix_bridge_mautrix_whatsapp_homeserver_domain | regex_escape }}$'
        exclusive: true
      - exclusive: true
        regex: '^@{{ matrix_bridge_mautrix_whatsapp_appservice_bot_username | regex_escape }}:{{ matrix_bridge_mautrix_whatsapp_homeserver_domain | regex_escape }}$'
  de.sorunome.msc2409.push_ephemeral: true
  receive_ephemeral: true
  io.element.msc4190: {{ matrix_bridge_mautrix_whatsapp_msc4190_enabled | to_json }}
